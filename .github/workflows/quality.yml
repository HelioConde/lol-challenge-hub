name: LoL Challenge Hub — QA e capturas Playwright
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lol-challenge-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar estrutura e sintaxe
        run: |
          node --check app.js
          node --check tests/browser-qa.cjs
          node tests/static-qa.cjs
      - name: Instalar Playwright e Chromium
        run: |
          npm install --prefix /tmp/lol-challenge-qa --no-save --package-lock=false playwright@1.56.1
          /tmp/lol-challenge-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Testar fluxos e capturar telas
        run: NODE_PATH=/tmp/lol-challenge-qa/node_modules node tests/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-hub-visual-qa-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
